<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enter readings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F5C5A}a:hover{color:#0A3F3E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F4F1; color: #17201B; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 20px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center">
    <div style="display: contents">
      <a href="PrintStrip.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -12px; color: #17201B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <div role="img" aria-label="Baremarks" style="display: flex; flex-direction: column; gap: 2px"><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap">Bare<span style="color: #B07A00">marks</span></div><svg viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true" style="display: block; width: 100%; height: 6px; fill: #B07A00"><rect x="0" y="0" width="100" height="1.4"></rect><rect x="0" y="0" width="1.2" height="6"></rect><rect x="5" y="0" width="1.2" height="3.4"></rect><rect x="10" y="0" width="1.2" height="3.4"></rect><rect x="15" y="0" width="1.2" height="3.4"></rect><rect x="20" y="0" width="1.2" height="3.4"></rect><rect x="25" y="0" width="1.2" height="6"></rect><rect x="30" y="0" width="1.2" height="3.4"></rect><rect x="35" y="0" width="1.2" height="3.4"></rect><rect x="40" y="0" width="1.2" height="3.4"></rect><rect x="45" y="0" width="1.2" height="3.4"></rect><rect x="50" y="0" width="1.2" height="6"></rect><rect x="55" y="0" width="1.2" height="3.4"></rect><rect x="60" y="0" width="1.2" height="3.4"></rect><rect x="65" y="0" width="1.2" height="3.4"></rect><rect x="70" y="0" width="1.2" height="3.4"></rect><rect x="75" y="0" width="1.2" height="6"></rect><rect x="80" y="0" width="1.2" height="3.4"></rect><rect x="85" y="0" width="1.2" height="3.4"></rect><rect x="90" y="0" width="1.2" height="3.4"></rect><rect x="95" y="0" width="1.2" height="3.4"></rect><rect x="98.8" y="0" width="1.2" height="6"></rect></svg></div>
    </div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A5650; text-align: right">STEP 3 / 5</div>
  </header>
  <div style="height: 4px; margin: 0 20px; background: #D9DED9; border-radius: 2px"><div style="width: 60%; height: 4px; background: {{accent}}; border-radius: 2px"></div></div>
  <main style="padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
    <div>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; line-height: 1.05; font-weight: 700">Enter your readings</h1>
      <p style="margin: 6px 0 0; font-size: 14px; line-height: 1.45; color: #4A5650">The strip number under your index finger at each distance. Half-millimetres are fine.</p>
    </div>

    <div style="display: flex; flex-direction: column; background: #FFFFFF; border-radius: 14px; border: 1px solid #D9DED9; overflow: hidden">
      <div style="display: grid; grid-template-columns: 72px minmax(0, 1fr) 96px; gap: 12px; padding: 10px 16px; font: 600 11px 'IBM Plex Sans', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5650; border-bottom: 1px solid #E3E7E3">
        <span>Distance</span><span>Reading</span><span>Point-on</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <div style="display: grid; grid-template-columns: 72px minmax(0, 1fr) 96px; gap: 12px; align-items: center; padding: 4px 16px; border-bottom: 1px solid #E3E7E3">
          <span style="display: flex; flex-direction: column; font: 500 16px 'IBM Plex Mono', monospace">{{r.d}}<sc-if value="{{r.near}}" hint-placeholder-val="{{ false }}"><span style="font: 600 10px 'IBM Plex Sans', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: #9A3412">Near</span></sc-if></span>
          <label style="display: flex; align-items: center; height: 44px; border-radius: 8px; border: 1px solid #C9CFC9; background: #F7F8F6; padding: 0 10px">
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Reading at {{r.d}}</span>
            <input value="{{r.v}}" placeholder="—" style="border: none; outline: none; width: 100%; font: 500 17px 'IBM Plex Mono', monospace; background: transparent; color: #17201B">
            <span style="font-size: 12px; color: #4A5650">mm</span>
          </label>
          <sc-if value="{{r.point}}" hint-placeholder-val="{{ false }}">
            <button style="height: 36px; border-radius: 18px; border: 2px solid #0F5C5A; background: #0F5C5A; color: #FFFFFF; font: 600 12px 'IBM Plex Sans', sans-serif">Point-on</button>
          </sc-if>
          <sc-if value="{{r.notPoint}}" hint-placeholder-val="{{ true }}">
            <button style="height: 36px; border-radius: 18px; border: 1px solid #C9CFC9; background: #FFFFFF; color: #4A5650; font: 500 12px 'IBM Plex Sans', sans-serif">Mark</button>
          </sc-if>
        </div>
      </sc-for>
      <button style="height: 52px; border: none; background: #FFFFFF; color: #0F5C5A; font: 600 14px 'IBM Plex Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a distance</button>
    </div>

    <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 10px; background: #E4ECEA; font-size: 13px; line-height: 1.4; color: #24322D">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F5C5A" stroke-width="2" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16v.5"></path></svg>
      <span>Include two or more near distances (under 15 m). Close up your crawl turns back, and they show us where.</span>
    </div>
  </main>
  <footer style="padding: 12px 20px 28px">
    <a href="Fit.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 12px; background: {{accent}}; color: #17201B; text-decoration: none; font: 700 18px 'Barlow Condensed', sans-serif; letter-spacing: 0.05em; text-transform: uppercase">Fit my curve</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E0A100","options":["#E0A100","#E86A33","#5BA4D9"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [['5 m', '26.5', false, true], ['10 m', '41.5', false, true], ['18 m', '39.5', false, false], ['25 m', '32.5', false, false], ['30 m', '26.5', false, false], ['40 m', '13.5', false, false], ['50 m', '0', true, false]];
    return {
      accent: this.props.accent ?? '#E0A100',
      rows: data.map(([d, v, p, near]) => ({ d, v, point: p, notPoint: !p, near }))
    };
  }
}
</script>
</body>
</html>
