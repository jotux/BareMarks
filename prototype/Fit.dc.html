<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Curve fit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F5C5A}a:hover{color:#0A3F3E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F4F1; color: #17201B; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 20px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center">
    <div style="display: contents">
      <a href="Record.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -12px; color: #17201B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <div role="img" aria-label="Baremarks" style="display: flex; flex-direction: column; gap: 2px"><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap">Bare<span style="color: #B07A00">marks</span></div><svg viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true" style="display: block; width: 100%; height: 6px; fill: #B07A00"><rect x="0" y="0" width="100" height="1.4"></rect><rect x="0" y="0" width="1.2" height="6"></rect><rect x="5" y="0" width="1.2" height="3.4"></rect><rect x="10" y="0" width="1.2" height="3.4"></rect><rect x="15" y="0" width="1.2" height="3.4"></rect><rect x="20" y="0" width="1.2" height="3.4"></rect><rect x="25" y="0" width="1.2" height="6"></rect><rect x="30" y="0" width="1.2" height="3.4"></rect><rect x="35" y="0" width="1.2" height="3.4"></rect><rect x="40" y="0" width="1.2" height="3.4"></rect><rect x="45" y="0" width="1.2" height="3.4"></rect><rect x="50" y="0" width="1.2" height="6"></rect><rect x="55" y="0" width="1.2" height="3.4"></rect><rect x="60" y="0" width="1.2" height="3.4"></rect><rect x="65" y="0" width="1.2" height="3.4"></rect><rect x="70" y="0" width="1.2" height="3.4"></rect><rect x="75" y="0" width="1.2" height="6"></rect><rect x="80" y="0" width="1.2" height="3.4"></rect><rect x="85" y="0" width="1.2" height="3.4"></rect><rect x="90" y="0" width="1.2" height="3.4"></rect><rect x="95" y="0" width="1.2" height="3.4"></rect><rect x="98.8" y="0" width="1.2" height="6"></rect></svg></div>
    </div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A5650; text-align: right">STEP 4 / 5</div>
  </header>
  <div style="height: 4px; margin: 0 20px; background: #D9DED9; border-radius: 2px"><div style="width: 80%; height: 4px; background: {{accent}}; border-radius: 2px"></div></div>
  <main style="padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
    <div>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; line-height: 1.05; font-weight: 700">Your crawl curve</h1>
      <p style="margin: 4px 0 0; font-size: 14px; line-height: 1.4; color: #4A5650">Your crawl peaks at the fold, then shrinks again up close.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #FFFFFF; border: 1px solid #D9DED9; border-radius: 12px; padding: 10px 12px">
        <div style="font-size: 11px; color: #4A5650; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600">Fit error</div>
        <div style="font: 500 20px 'IBM Plex Mono', monospace; margin-top: 2px">{{rms}}<span style="font-size: 12px; color: #4A5650"> mm</span></div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #D9DED9; border-radius: 12px; padding: 10px 12px">
        <div style="font-size: 11px; color: #4A5650; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600">Fold</div>
        <div style="font: 500 20px 'IBM Plex Mono', monospace; margin-top: 2px">{{fold}}<span style="font-size: 12px; color: #4A5650"> m</span></div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #D9DED9; border-radius: 12px; padding: 10px 12px">
        <div style="font-size: 11px; color: #4A5650; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600">Point-on</div>
        <div style="font: 500 20px 'IBM Plex Mono', monospace; margin-top: 2px">{{pointOn}}<span style="font-size: 12px; color: #4A5650"> m</span></div>
      </div>
    </div>

    <figure style="margin: 0; background: #FFFFFF; border: 1px solid #D9DED9; border-radius: 14px; padding: 12px 14px 10px">
      <div style="position: relative; width: 320px; height: 220px">
        <svg width="320" height="220" viewBox="0 0 320 220" role="img" aria-label="Crawl rises from about 26 millimetres at 5 metres to a peak near 12 metres, then falls to zero at 50 metres. Near and far distances share the same crawl." style="position: absolute; left: 0; top: 0">
          <line x1="30" y1="190" x2="314" y2="190" stroke="#8A948E"></line>
          <line x1="30" y1="150" x2="314" y2="150" stroke="#EEF1EE"></line>
          <line x1="30" y1="110" x2="314" y2="110" stroke="#EEF1EE"></line>
          <line x1="30" y1="70" x2="314" y2="70" stroke="#EEF1EE"></line>
          <line x1="30" y1="30" x2="314" y2="30" stroke="#EEF1EE"></line>
          <line x1="{{foldX}}" y1="14" x2="{{foldX}}" y2="190" stroke="#4A5650" stroke-dasharray="3 4"></line>
          <line x1="{{pairX1}}" y1="{{pairY}}" x2="{{pairX2}}" y2="{{pairY}}" stroke="#8A948E" stroke-dasharray="2 3"></line>
          <path d="{{farCurve}}" fill="none" stroke="#0F5C5A" stroke-width="2.5"></path>
          <path d="{{nearCurve}}" fill="none" stroke="#C2410C" stroke-width="2.5" stroke-dasharray="6 4"></path>
        </svg>
        <div style="position: absolute; left: {{foldLabelX}}; top: 0; font: 600 10px 'IBM Plex Sans', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: #24322D">Fold</div>
        <sc-for list="{{pts}}" as="p" hint-placeholder-count="7">
          <div style="position: absolute; left: {{p.left}}; top: {{p.top}}; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: {{p.radius}}; background: {{p.fill}}; border: 2px solid #17201B; box-sizing: border-box"></div>
        </sc-for>
        <sc-for list="{{yLabels}}" as="y" hint-placeholder-count="5">
          <div style="position: absolute; left: 0; top: {{y.top}}; width: 24px; text-align: right; transform: translateY(-50%); font: 500 10px 'IBM Plex Mono', monospace; color: #4A5650">{{y.n}}</div>
        </sc-for>
        <sc-for list="{{xLabels}}" as="x" hint-placeholder-count="6">
          <div style="position: absolute; top: 196px; left: {{x.left}}; transform: translateX(-50%); font: 500 10px 'IBM Plex Mono', monospace; color: #4A5650">{{x.n}}</div>
        </sc-for>
      </div>
      <figcaption style="display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11px; color: #4A5650; margin-top: 8px">
        <span style="display: flex; align-items: center; gap: 5px"><svg width="20" height="6" aria-hidden="true"><line x1="0" y1="3" x2="20" y2="3" stroke="#C2410C" stroke-width="2.5" stroke-dasharray="6 4"></line></svg>Near branch</span>
        <span style="display: flex; align-items: center; gap: 5px"><svg width="20" height="6" aria-hidden="true"><line x1="0" y1="3" x2="20" y2="3" stroke="#0F5C5A" stroke-width="2.5"></line></svg>Far branch</span>
        <span>Crawl mm ↑ · distance m →</span>
      </figcaption>
    </figure>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 600">Same crawl, two distances</div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{pairs}}" as="m" hint-placeholder-count="5">
          <div style="display: flex; gap: 6px; align-items: baseline; padding: 6px 10px; background: #FFFFFF; border: 1px solid #D9DED9; border-radius: 8px; font: 500 13px 'IBM Plex Mono', monospace"><span style="color: #9A3412">{{m.near}}</span><span style="color: #4A5650">=</span><span style="color: #0A3F3E">{{m.far}}</span></div>
        </sc-for>
      </div>
    </div>
  </main>
  <footer style="padding: 10px 20px 24px">
    <a href="Sheet.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 12px; background: {{accent}}; color: #17201B; text-decoration: none; font: 700 18px 'Barlow Condensed', sans-serif; letter-spacing: 0.05em; text-transform: uppercase">Build marker sheet</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E0A100","options":["#E0A100","#E86A33","#5BA4D9"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // readings: [distance m, crawl mm]
    const data = [[5, 26.5], [10, 41.5], [18, 39.5], [25, 32.5], [30, 26.5], [40, 13.5], [50, 0]];
    // two-crossing model: crawl = a - b/d - c*d  (arrow below the eye crosses the line of sight twice)
    const basis = (d) => [1, -1 / d, -d];
    const A = [[0,0,0],[0,0,0],[0,0,0]], r = [0,0,0];
    data.forEach(([d, y]) => { const b = basis(d); for (let i = 0; i < 3; i++) { r[i] += b[i] * y; for (let j = 0; j < 3; j++) A[i][j] += b[i] * b[j]; } });
    const M = A.map((row, i) => row.concat([r[i]]));
    for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) { const k = M[j][i] / M[i][i]; for (let m = i; m < 4; m++) M[j][m] -= k * M[i][m]; }
    const p = [0, 0, 0];
    for (let i = 2; i >= 0; i--) { let v = M[i][3]; for (let k = i + 1; k < 3; k++) v -= M[i][k] * p[k]; p[i] = v / M[i][i]; }
    const f = (d) => p[0] - p[1] / d - p[2] * d;
    const fold = Math.sqrt(p[1] / p[2]);
    const twin = (d) => p[1] / (p[2] * d);

    const X = (x) => 30 + x / 55 * 284, Y = (y) => 190 - Math.max(y, -3) / 45 * 180;
    const path = (a, b) => { let s = ''; for (let x = a; x <= b + 1e-9; x += 0.25) s += (s ? ' L' : 'M') + X(x).toFixed(1) + ' ' + Y(f(x)).toFixed(1); return s; };
    const rms = Math.sqrt(data.reduce((s, [d, y]) => s + (f(d) - y) ** 2, 0) / data.length);
    let po = fold; while (f(po) > 0 && po < 80) po += 0.1;

    return {
      accent: this.props.accent ?? '#E0A100',
      rms: rms.toFixed(1),
      fold: fold.toFixed(0),
      pointOn: po.toFixed(0),
      farCurve: path(fold, 52),
      nearCurve: path(3, fold),
      foldX: X(fold).toFixed(1),
      foldLabelX: (X(fold) + 5) + 'px',
      pairX1: X(5).toFixed(1), pairX2: X(twin(5)).toFixed(1), pairY: Y(f(5)).toFixed(1),
      pts: data.map(([d, y]) => {
        const near = d < fold;
        return { left: X(d) + 'px', top: Y(y) + 'px', fill: near ? '#F2A27A' : (this.props.accent ?? '#E0A100'), radius: near ? '2px' : '6px' };
      }),
      yLabels: [0, 10, 20, 30, 40].map((v) => ({ n: String(v), top: Y(v) + 'px' })),
      xLabels: [10, 20, 30, 40, 50].map((v) => ({ n: String(v), left: X(v) + 'px' })),
      pairs: [3, 5, 6, 8, 10].map((d) => ({ near: d + ' m', far: (Math.round(twin(d) * 2) / 2) + ' m' }))
    };
  }
}
</script>
</body>
</html>
