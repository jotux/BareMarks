<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F5C5A}a:hover{color:#0A3F3E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F4F1; color: #17201B; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 20px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center">
    <span aria-hidden="true" style="height: 44px"></span>
    <div role="img" aria-label="Baremarks" style="display: flex; flex-direction: column; gap: 2px"><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap">Bare<span style="color: #B07A00">marks</span></div><svg viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true" style="display: block; width: 100%; height: 6px; fill: #B07A00"><rect x="0" y="0" width="100" height="1.4"></rect><rect x="0" y="0" width="1.2" height="6"></rect><rect x="5" y="0" width="1.2" height="3.4"></rect><rect x="10" y="0" width="1.2" height="3.4"></rect><rect x="15" y="0" width="1.2" height="3.4"></rect><rect x="20" y="0" width="1.2" height="3.4"></rect><rect x="25" y="0" width="1.2" height="6"></rect><rect x="30" y="0" width="1.2" height="3.4"></rect><rect x="35" y="0" width="1.2" height="3.4"></rect><rect x="40" y="0" width="1.2" height="3.4"></rect><rect x="45" y="0" width="1.2" height="3.4"></rect><rect x="50" y="0" width="1.2" height="6"></rect><rect x="55" y="0" width="1.2" height="3.4"></rect><rect x="60" y="0" width="1.2" height="3.4"></rect><rect x="65" y="0" width="1.2" height="3.4"></rect><rect x="70" y="0" width="1.2" height="3.4"></rect><rect x="75" y="0" width="1.2" height="6"></rect><rect x="80" y="0" width="1.2" height="3.4"></rect><rect x="85" y="0" width="1.2" height="3.4"></rect><rect x="90" y="0" width="1.2" height="3.4"></rect><rect x="95" y="0" width="1.2" height="3.4"></rect><rect x="98.8" y="0" width="1.2" height="6"></rect></svg></div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A5650; text-align: right">STEP 1 / 5</div>
  </header>
  <div style="height: 4px; margin: 0 20px; background: #D9DED9; border-radius: 2px"><div style="width: 20%; height: 4px; background: {{accent}}; border-radius: 2px"></div></div>
  <main style="padding: 20px; display: flex; flex-direction: column; gap: 18px; flex-grow: 1">
    <div>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; line-height: 1.05; font-weight: 700">Describe your tab</h1>
      <p style="margin: 6px 0 0; font-size: 14px; line-height: 1.45; color: #4A5650">We'll print a measuring strip sized to fit the face of your tab.</p>
    </div>

    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; font-weight: 600; margin-bottom: 8px">Shooting hand</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button style="height: 44px; border-radius: 10px; border: 2px solid #17201B; background: #17201B; color: #FFFFFF; font: 600 15px 'IBM Plex Sans', sans-serif">Right</button>
        <button style="height: 44px; border-radius: 10px; border: 2px solid #C9CFC9; background: #FFFFFF; color: #17201B; font: 500 15px 'IBM Plex Sans', sans-serif">Left</button>
      </div>
    </fieldset>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Face length
        <span style="display: flex; align-items: center; height: 48px; border-radius: 10px; background: #FFFFFF; border: 1px solid #C9CFC9; padding: 0 12px">
          <input value="72" style="border: none; outline: none; width: 100%; font: 500 18px 'IBM Plex Mono', monospace; background: transparent; color: #17201B">
          <span style="font-size: 13px; color: #4A5650">mm</span>
        </span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Face width
        <span style="display: flex; align-items: center; height: 48px; border-radius: 10px; background: #FFFFFF; border: 1px solid #C9CFC9; padding: 0 12px">
          <input value="38" style="border: none; outline: none; width: 100%; font: 500 18px 'IBM Plex Mono', monospace; background: transparent; color: #17201B">
          <span style="font-size: 13px; color: #4A5650">mm</span>
        </span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Marking zone starts
        <span style="display: flex; align-items: center; height: 48px; border-radius: 10px; background: #FFFFFF; border: 1px solid #C9CFC9; padding: 0 12px">
          <input value="6" style="border: none; outline: none; width: 100%; font: 500 18px 'IBM Plex Mono', monospace; background: transparent; color: #17201B">
          <span style="font-size: 13px; color: #4A5650">mm</span>
        </span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Marking zone ends
        <span style="display: flex; align-items: center; height: 48px; border-radius: 10px; background: #FFFFFF; border: 1px solid #C9CFC9; padding: 0 12px">
          <input value="58" style="border: none; outline: none; width: 100%; font: 500 18px 'IBM Plex Mono', monospace; background: transparent; color: #17201B">
          <span style="font-size: 13px; color: #4A5650">mm</span>
        </span>
      </label>
    </div>

    <fieldset style="border: none; margin: 0; padding: 0">
      <legend style="font-size: 13px; font-weight: 600; margin-bottom: 8px">Distances to sight in</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{distances}}" as="d" hint-placeholder-count="8">
          <sc-if value="{{d.on}}" hint-placeholder-val="{{ true }}">
            <button style="height: 44px; min-width: 60px; padding: 0 12px; border-radius: 22px; border: 2px solid #0F5C5A; background: #0F5C5A; color: #FFFFFF; font: 500 14px 'IBM Plex Mono', monospace">{{d.label}}</button>
          </sc-if>
          <sc-if value="{{d.off}}" hint-placeholder-val="{{ false }}">
            <button style="height: 44px; min-width: 60px; padding: 0 12px; border-radius: 22px; border: 2px solid #C9CFC9; background: #FFFFFF; color: #4A5650; font: 500 14px 'IBM Plex Mono', monospace">{{d.label}}</button>
          </sc-if>
        </sc-for>
      </div>
    </fieldset>

    <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 10px; background: #E4ECEA; font-size: 13px; line-height: 1.4; color: #24322D">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F5C5A" stroke-width="2" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16v.5"></path></svg>
      <span>Measure from the top edge of the tab face, where it sits under your index finger.</span>
    </div>
  </main>
  <footer style="padding: 12px 20px 28px">
    <a href="PrintStrip.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 12px; background: {{accent}}; color: #17201B; text-decoration: none; font: 700 18px 'Barlow Condensed', sans-serif; letter-spacing: 0.05em; text-transform: uppercase">Make sight-in strip</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E0A100","options":["#E0A100","#E86A33","#5BA4D9"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = [5, 10, 18, 25, 30, 40, 50];
    const all = [3, 5, 10, 15, 18, 20, 25, 30, 40, 50];
    return {
      accent: this.props.accent ?? '#E0A100',
      distances: all.map((m) => ({ label: m + ' m', on: on.includes(m), off: !on.includes(m) }))
    };
  }
}
</script>
</body>
</html>
